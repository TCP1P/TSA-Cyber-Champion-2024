name: Eksploitasi Kerentanan XSS V2
author: dimas
description: '**Author**: dimas


  Di sebuah lembaga penelitian kesehatan terkemuka, Anda diberikan akses ke aplikasi web internal yang memiliki fitur pencarian dan tampilan profil pengguna. Namun, aplikasi ini memiliki kerentanan XSS (Cross-Site Scripting) yang dapat dimanfaatkan untuk tujuan keamanan.


  Sebagai seorang analis keamanan, tugas Anda adalah memanfaatkan kerentanan XSS ini untuk mengeksekusi JavaScript di dalam aplikasi dan menemukan kode rahasia yang tersembunyi. Setelah menemukan kode rahasia tersebut, Anda perlu mendekripsi kode untuk mengungkap flag yang tersembunyi. Flag ini berisi informasi penting yang dapat mempengaruhi keputusan atau penelitian medis.


